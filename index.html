<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="referrer" content="no-referrer"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>X 情报</title>
<style>
  :root {
    --bg:#0b0d10; --card:#151a21; --text:#e8eaed; --muted:#9aa3ad;
    --line:#243041; --a:#7dd3fc; --b:#fbbf24; --chip:#1f2937;
  }
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
       background:var(--bg);color:var(--text)}
  header{position:sticky;top:0;z-index:2;backdrop-filter:blur(10px);
         background:rgba(11,13,16,.9);border-bottom:1px solid var(--line);
         padding:14px 16px}
  h1{margin:0;font-size:18px;font-weight:650}
  .meta{color:var(--muted);font-size:13px;margin-top:4px}
  nav{display:flex;gap:8px;margin-top:10px}
  nav a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:999px;
        background:var(--chip);font-size:13px}
  nav a.active{color:#0b0d10;background:var(--a);font-weight:600}
  main{max-width:720px;margin:0 auto;padding:16px}
  section{display:none}
  section.show{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:14px 14px 12px;margin:0 0 12px}
  .author{font-size:13px;color:var(--a);font-weight:600}
  .text{margin:8px 0;white-space:pre-wrap;word-break:break-word}
  .orig{margin-top:6px;font-size:12px;color:var(--muted);white-space:pre-wrap;word-break:break-word;
        border-top:1px dashed var(--line);padding-top:8px}
  .why,.heat{font-size:12px;color:var(--muted)}
  .why{margin-top:6px}
  .link{display:inline-block;margin-top:8px;margin-right:10px;font-size:12px;color:var(--b);text-decoration:none}
  .empty{color:var(--muted);padding:40px 8px;text-align:center}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;
       background:var(--chip);color:var(--muted);margin-bottom:8px}
  .media{display:grid;gap:8px;margin-top:10px}
  .media img,.media video{width:100%;max-height:420px;object-fit:contain;border-radius:10px;
        background:#0b0d10;border:1px solid var(--line)}
  .vwrap{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#0b0d10}
  .vwrap video{display:block;width:100%;max-height:420px;background:#000}
  .vwrap .poster{display:block;width:100%;max-height:420px;object-fit:contain}
  .vwrap .playbtn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
        background:rgba(0,0,0,.35);border:0;cursor:pointer;color:#fff;font-size:15px;font-weight:600}
  .vwrap .playbtn span{background:rgba(0,0,0,.65);padding:10px 14px;border-radius:999px}
  .vwrap.loading .playbtn span::after{content:" 加载中…"}
  .vwrap.error .playbtn span{background:#7f1d1d}
  .vhints{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
</style>
</head>
<body>
<header>
  <h1>X 情报</h1>
  <div class="meta" id="meta">加载中…</div>
  <nav>
    <a href="#related" id="tab-related" class="active">相关</a>
    <a href="#hot" id="tab-hot">全站最热</a>
  </nav>
</header>
<main>
  <section id="related" class="show"></section>
  <section id="hot"></section>
</main>
<script>
async function load(){
  const r = await fetch('data/latest.json?_=' + Date.now(), {referrerPolicy:'no-referrer'});
  if(!r.ok){ document.getElementById('meta').textContent = '加载失败 ' + r.status; return; }
  const d = await r.json();
  document.getElementById('meta').textContent =
    (d.date || '') + (d.updated_at ? ' · 更新 ' + d.updated_at : '') + ' · 中文译文';
  render('related', d.related || [], '相关');
  render('hot', d.hot || [], '全站最热');
  document.getElementById('tab-related').textContent = '相关 ' + (d.related||[]).length;
  document.getElementById('tab-hot').textContent = '全站最热 ' + (d.hot||[]).length;
  bindVideoPlayers(document);
}
function mediaHtml(media, pageUrl){
  if(!Array.isArray(media) || !media.length) return '';
  return '<div class="media">' + media.map(m => {
    const type = (m.type||'').toLowerCase();
    const url = m.url || '';
    const preview = m.preview_url || m.preview || '';
    if(type === 'video' || type === 'animated_gif'){
      if(!url && !preview) return '';
      const poster = preview ? `<img class="poster" src="${esc(preview)}" alt="" referrerpolicy="no-referrer" loading="lazy"/>` : '';
      const hints = `<div class="vhints">
        ${url ? `<a class="link" href="${esc(url)}" target="_blank" rel="noreferrer noopener">直链播放</a>` : ''}
        ${pageUrl ? `<a class="link" href="${esc(pageUrl)}" target="_blank" rel="noreferrer noopener">在 X 打开</a>` : ''}
      </div>`;
      if(!url){
        return `<div class="vwrap">${poster}${hints}</div>`;
      }
      return `<div class="vwrap" data-src="${esc(url)}">
        ${poster}
        <button type="button" class="playbtn" aria-label="播放"><span>▶ 播放</span></button>
        <video controls playsinline preload="none" referrerpolicy="no-referrer" style="display:none"></video>
      </div>${hints}`;
    }
    if(url || preview) return `<img src="${esc(url||preview)}" alt="" loading="lazy" referrerpolicy="no-referrer"/>`;
    return '';
  }).join('') + '</div>';
}
async function playFromBlob(wrap){
  const url = wrap.getAttribute('data-src');
  if(!url) return;
  if(wrap.dataset.loaded === '1'){
    const v = wrap.querySelector('video');
    v && v.play();
    return;
  }
  wrap.classList.add('loading');
  wrap.classList.remove('error');
  try{
    const res = await fetch(url, {referrerPolicy:'no-referrer', mode:'cors', credentials:'omit'});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    const obj = URL.createObjectURL(blob);
    const video = wrap.querySelector('video');
    const poster = wrap.querySelector('.poster');
    const btn = wrap.querySelector('.playbtn');
    video.src = obj;
    video.style.display = 'block';
    if(poster) poster.style.display = 'none';
    if(btn) btn.style.display = 'none';
    wrap.dataset.loaded = '1';
    await video.play();
  }catch(e){
    wrap.classList.add('error');
    const btn = wrap.querySelector('.playbtn span');
    if(btn) btn.textContent = '加载失败，点下方直链/X';
    console.warn('video fetch failed', e);
  }finally{
    wrap.classList.remove('loading');
  }
}
function bindVideoPlayers(root){
  root.querySelectorAll('.vwrap[data-src]').forEach(wrap => {
    const btn = wrap.querySelector('.playbtn');
    if(btn) btn.addEventListener('click', () => playFromBlob(wrap));
  });
}
function bodyText(it){
  const zh = it.text_zh || it.text || '';
  const en = it.text_en || '';
  let html = `<div class="text">${esc(zh)}</div>`;
  if(en && en.trim() && en.trim() !== zh.trim()){
    html += `<div class="orig">原文：${esc(en)}</div>`;
  }
  return html;
}
function render(id, items, label){
  const el = document.getElementById(id);
  if(!items.length){ el.innerHTML = '<div class="empty">暂无</div>'; return; }
  el.innerHTML = items.map((it,i) => `
    <article class="card">
      <div class="tag">${label} · ${i+1}</div>
      <div class="author">${esc(it.author||'')}</div>
      ${bodyText(it)}
      ${mediaHtml(it.media, it.url)}
      ${it.why ? `<div class="why">${esc(it.why)}</div>` : ''}
      ${it.heat ? `<div class="heat">${esc(it.heat)}</div>` : ''}
      ${it.url ? `<a class="link" href="${esc(it.url)}" target="_blank" rel="noreferrer noopener">原文链接（可选）</a>` : ''}
    </article>`).join('');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function show(hash){
  const name = (hash||'#related').replace('#','') || 'related';
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('show', s.id===name));
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active', a.getAttribute('href')==='#'+name));
}
window.addEventListener('hashchange', ()=>show(location.hash));
show(location.hash);
load();
setInterval(load, 60000);
</script>
</body>
</html>
