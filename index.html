<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="referrer" content="no-referrer"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>X 情报</title>
<style>
  :root {
    --bg:#0b0d10; --card:#151a21; --text:#e8eaed; --muted:#9aa3ad;
    --line:#243041; --a:#7dd3fc; --b:#fbbf24; --chip:#1f2937;
  }
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
       background:var(--bg);color:var(--text)}
  header{position:sticky;top:0;z-index:2;backdrop-filter:blur(10px);
         background:rgba(11,13,16,.92);border-bottom:1px solid var(--line);
         padding:14px 16px}
  h1{margin:0;font-size:18px;font-weight:650}
  .meta{color:var(--muted);font-size:13px;margin-top:4px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
  .controls select,.controls button{appearance:none;border:1px solid var(--line);background:var(--chip);
        color:var(--text);border-radius:10px;padding:8px 10px;font-size:13px}
  .kind{display:flex;gap:6px}
  .kind button{cursor:pointer}
  .kind button.active{background:var(--a);color:#0b0d10;border-color:var(--a);font-weight:600}
  nav{display:flex;gap:8px;margin-top:10px}
  nav a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:999px;
        background:var(--chip);font-size:13px}
  nav a.active{color:#0b0d10;background:var(--a);font-weight:600}
  main{max-width:720px;margin:0 auto;padding:16px}
  section{display:none}
  section.show{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:14px 14px 12px;margin:0 0 12px}
  .author{font-size:13px;color:var(--a);font-weight:600}
  .text{margin:8px 0;white-space:pre-wrap;word-break:break-word}
  .orig{margin-top:6px;font-size:12px;color:var(--muted);white-space:pre-wrap;word-break:break-word;
        border-top:1px dashed var(--line);padding-top:8px}
  .why,.heat{font-size:12px;color:var(--muted)}
  .why{margin-top:6px}
  .link{display:inline-block;margin-top:8px;margin-right:10px;font-size:12px;color:var(--b);text-decoration:none}
  .empty{color:var(--muted);padding:40px 8px;text-align:center}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;
       background:var(--chip);color:var(--muted);margin-bottom:8px}
  .media{display:grid;gap:8px;margin-top:10px}
  .media img{width:100%;max-height:420px;object-fit:contain;border-radius:10px;
        background:#0b0d10;border:1px solid var(--line);cursor:zoom-in}
  .lightbox{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
        background:rgba(0,0,0,.88);padding:16px}
  .lightbox.show{display:flex}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
  .lightbox .close{position:absolute;top:12px;right:14px;border:0;border-radius:999px;
        background:rgba(255,255,255,.15);color:#fff;width:40px;height:40px;font-size:22px;cursor:pointer}
  .vwrap{position:relative;display:block;border-radius:10px;overflow:hidden;border:1px solid var(--line);
         background:#0b0d10;text-decoration:none;color:inherit}
  .vwrap .poster{display:block;width:100%;max-height:420px;object-fit:contain;background:#000}
  .vwrap .playbtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
        display:flex;align-items:center;justify-content:center;pointer-events:none;
        width:44px;height:44px;border-radius:999px;background:rgba(0,0,0,.55);
        border:1px solid rgba(255,255,255,.35);box-shadow:0 4px 16px rgba(0,0,0,.35)}
  .vwrap .playbtn span{color:#fff;font-size:16px;line-height:1;margin-left:2px}
</style>
</head>
<body>
<header>
  <h1>X 情报</h1>
  <div class="meta" id="meta">加载中…</div>
  <div class="controls">
    <div class="kind" id="kind">
      <button type="button" data-kind="daily" class="active">每日</button>
      <button type="button" data-kind="weekly">每周</button>
      <button type="button" data-kind="monthly">每月</button>
    </div>
    <select id="period" aria-label="选择往期"></select>
  </div>
  <nav>
    <a href="#related" id="tab-related" class="active">相关</a>
    <a href="#hot" id="tab-hot">全站最热</a>
  </nav>
</header>
<main>
  <section id="related" class="show"></section>
  <section id="hot"></section>
</main>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="查看大图">
  <button type="button" class="close" id="lightbox-close" aria-label="关闭">×</button>
  <img id="lightbox-img" alt=""/>
</div>

<script>
const state = { kind:'daily', index:null, current:null };

async function boot(){
  const idxRes = await fetch('data/index.json?_=' + Date.now(), {referrerPolicy:'no-referrer'});
  if(!idxRes.ok){
    // fallback: only latest
    await loadPath('data/latest.json');
    document.getElementById('period').innerHTML = '<option>最新</option>';
    return;
  }
  state.index = await idxRes.json();
  document.querySelectorAll('#kind button').forEach(btn => {
    btn.onclick = () => {
      state.kind = btn.dataset.kind;
      document.querySelectorAll('#kind button').forEach(b=>b.classList.toggle('active', b===btn));
      fillPeriodSelect(true);
    };
  });
  document.getElementById('period').onchange = () => loadSelected();
  fillPeriodSelect(true);
}

function listForKind(kind){
  const arr = (state.index && state.index[kind]) || [];
  // newest first
  return [...arr].reverse();
}

function fillPeriodSelect(loadFirst){
  const sel = document.getElementById('period');
  const list = listForKind(state.kind);
  if(!list.length){
    sel.innerHTML = '<option value="">暂无往期</option>';
    document.getElementById('related').innerHTML = '<div class="empty">这一类还没有存档。每天/周日/月末跑完会自动留下。</div>';
    document.getElementById('hot').innerHTML = '';
    document.getElementById('meta').textContent = state.kind + ' · 暂无';
    document.getElementById('tab-related').textContent = '相关';
    document.getElementById('tab-hot').textContent = '全站最热';
    return;
  }
  sel.innerHTML = list.map(x => `<option value="${esc(x.path)}">${esc(x.label||x.id)}</option>`).join('');
  if(loadFirst) loadSelected();
}

async function loadSelected(){
  const path = document.getElementById('period').value;
  if(!path) return;
  await loadPath(path);
}

async function loadPath(path){
  const r = await fetch(path + '?_=' + Date.now(), {referrerPolicy:'no-referrer'});
  if(!r.ok){ document.getElementById('meta').textContent = '加载失败 ' + r.status; return; }
  const d = await r.json();
  state.current = d;
  const kindLabel = ({daily:'每日',weekly:'每周',monthly:'每月'})[d.kind||state.kind] || '';
  document.getElementById('meta').textContent =
    (d.label || d.date || '') + (d.updated_at ? ' · 更新 ' + d.updated_at : '') +
    (kindLabel ? ' · ' + kindLabel : '') + ' · 中文译文';
  render('related', d.related || [], '相关');
  render('hot', d.hot || [], '全站最热');
  document.getElementById('tab-related').textContent = '相关 ' + (d.related||[]).length;
  document.getElementById('tab-hot').textContent = '全站最热 ' + (d.hot||[]).length;
  bindZoomables(document);
}

function statusIdFromUrl(u){
  const m = String(u||'').match(/status\/(\d+)/);
  return m ? m[1] : '';
}
function xVideoHref(pageUrl, mediaUrl, mediaIndex){
  const id = statusIdFromUrl(pageUrl);
  const idx = (mediaIndex==null ? 1 : mediaIndex);
  // Native video deep link: lands on video player view more often than plain status URL
  if(id) return 'https://x.com/i/status/' + id + '/video/' + idx;
  if(pageUrl) return pageUrl;
  return mediaUrl || '';
}
function mediaHtml(media, pageUrl){
  if(!Array.isArray(media) || !media.length) return '';
  let videoOrdinal = 0;
  return '<div class="media">' + media.map(m => {
    const type = (m.type||'').toLowerCase();
    const url = m.url || '';
    const preview = m.preview_url || m.preview || '';
    if(type === 'video' || type === 'animated_gif'){
      videoOrdinal += 1;
      const href = xVideoHref(pageUrl, url, videoOrdinal);
      if(!href && !preview) return '';
      const poster = preview
        ? `<img class="poster" src="${esc(preview)}" alt="" referrerpolicy="no-referrer" loading="lazy"/>`
        : `<div class="poster" style="height:180px"></div>`;
      if(!href) return poster;
      return `<a class="vwrap" href="${esc(href)}" target="_blank" rel="noreferrer noopener">
        ${poster}
        <div class="playbtn" aria-label="播放"><span>▶</span></div>
      </a>`;
    }
    if(url || preview){
      const src = url||preview;
      return `<img class="zoomable" src="${esc(src)}" data-full="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer"/>`;
    }
    return '';
  }).join('') + '</div>';
}
function bodyText(it){
  // 只展示中文译文；英文原文不显示（媒体/视频仍保留）
  const zh = it.text_zh || it.text || '';
  return `<div class="text">${esc(zh)}</div>`;
}
function render(id, items, label){
  const el = document.getElementById(id);
  if(!items.length){ el.innerHTML = '<div class="empty">暂无</div>'; return; }
  el.innerHTML = items.map((it,i) => `
    <article class="card">
      <div class="tag">${label} · ${i+1}</div>
      <div class="author">${esc(it.author||'')}</div>
      ${bodyText(it)}
      ${mediaHtml(it.media, it.url)}
      ${it.why ? `<div class="why">${esc(it.why)}</div>` : ''}
      ${it.heat ? `<div class="heat">${esc(it.heat)}</div>` : ''}
      ${it.url ? `<a class="link" href="${esc(it.url)}" target="_blank" rel="noreferrer noopener">原文链接</a>` : ''}
    </article>`).join('');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function openLightbox(src){
  const box = document.getElementById('lightbox');
  const img = document.getElementById('lightbox-img');
  img.src = src;
  img.referrerPolicy = 'no-referrer';
  box.classList.add('show');
}
function closeLightbox(){
  const box = document.getElementById('lightbox');
  const img = document.getElementById('lightbox-img');
  box.classList.remove('show');
  img.removeAttribute('src');
}
function bindZoomables(root){
  root.querySelectorAll('img.zoomable').forEach(img => {
    img.addEventListener('click', () => openLightbox(img.dataset.full || img.src));
  });
}

function show(hash){
  const name = (hash||'#related').replace('#','') || 'related';
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('show', s.id===name));
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active', a.getAttribute('href')==='#'+name));
}
window.addEventListener('hashchange', ()=>show(location.hash));
show(location.hash);
document.getElementById('lightbox-close').onclick = closeLightbox;
document.getElementById('lightbox').addEventListener('click', (e)=>{ if(e.target.id==='lightbox') closeLightbox(); });
window.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeLightbox(); });
boot();
</script>
</body>
</html>
